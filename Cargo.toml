[package]
name = "crabsim"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
env_logger = "0.11.8"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9.2"

[[bench]]
name = "reference"
harness = false

# Measured with the reference benchmark: about 11% less time than the default on the demo model
# and 7% on the large one. Fat LTO measured the same as thin and takes longer to build.
# `panic` stays "unwind", because `LiveSession` catches panics to report them.
[profile.release]
lto = "thin"
codegen-units = 1
