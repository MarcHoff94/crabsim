[package]
name = "crabsim"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
rand = "0.9.2"

[[bench]]
name = "reference"
harness = false

# The engine is the root package, with member crates for model files (`model/`), the operation
# catalogue (`catalogue/`), the headless CLI (`cli/`), the MCP server (`mcp/`) and the UI (`ui/`). The
# UI and the MCP server aren't default members, so `cargo test` and `cargo bench` here never build
# Bevy or tokio. The engine depends on none of them (ADR 0009).
[workspace]
members = ["model", "catalogue", "cli", "mcp", "ui"]
default-members = [".", "model", "catalogue", "cli"]

# Measured with the reference benchmark: about 11% less time than the default on the demo model
# and 7% on the large one. Fat LTO measured the same as thin and takes longer to build.
# `panic` stays "unwind", because `LiveSession` catches panics to report them.
[profile.release]
lto = "thin"
codegen-units = 1

# For running the UI optimised day to day: with the tuned release profile above, a one-line
# change in the UI prototype took about 2 minutes to rebuild, and without LTO 7 to 8 s.
# `cargo run -p crabsim-ui --profile ui`
[profile.ui]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Bevy is slow unoptimised, so dependencies are optimised in debug builds too. The engine's own
# dependencies are small, so its tests barely notice.
[profile.dev.package."*"]
opt-level = 3
