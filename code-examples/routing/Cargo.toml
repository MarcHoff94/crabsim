# An example code module for crabsim (ADR 0029). Build it into a models folder's `code/` folder:
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/routing.wasm <models folder>/code/
# It is its own workspace, outside crabsim's, so it builds for WebAssembly alone.
[package]
name = "routing"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib for WebAssembly; rlib so a test can run the same functions natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
crabsim-guest = { path = "../../guest" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
