[package]
name = "crabsim-guest"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bindings for writing crabsim user code in Rust (ADR 0029): compiled to WebAssembly for crabsim to run, or natively to debug from your own tests"

# Built for wasm32-unknown-unknown it needs nothing. Natively it calls crabsim's host directly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crabsim-code = { path = "../code-host" }
