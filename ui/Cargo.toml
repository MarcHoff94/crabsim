[package]
name = "crabsim-ui"
version = "0.1.0"
edition = "2024"
publish = false

# Bevy and bevy_egui are pinned and upgraded only for a reason: see ADR 0006.
[dependencies]
crabsim = { path = ".." }
bevy = "=0.20.1"
bevy_egui = "=0.43.1"
# The models folder, reached only through the operation catalogue, as the user (spec issue 63).
crabsim-catalogue = { path = "../catalogue" }
crabsim-model = { path = "../model" }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
# Where the models folder goes when none is given: the user's Documents, as the OS has it.
dirs = "6"
